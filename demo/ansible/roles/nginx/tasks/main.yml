---
# 1. Cap nhat danh sach goi apt
- name: Cap nhat danh sach goi apt
  ansible.builtin.apt:
    update_cache: yes
    cache_valid_time: 3600

# 2. Cai dat Nginx
- name: Cai dat Nginx web server
  ansible.builtin.apt:
    name: nginx
    state: present

# 3. Ghi file cau hinh Template Nginx (CHẠY TRƯỚC ĐỂ ĐẢM BẢO CONFIG ĐÚNG)
- name: Deploy file cau hinh Nginx tu Jinja2 Template
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: /etc/nginx/sites-available/default
    owner: root
    group: root
    mode: '0644'
  notify: Restart Nginx




# Tao trang index.html chao muong
- name: Tao trang index.html mau cho Web Server
  ansible.builtin.copy:
    content: |
      <! formal html >
      <html>
      <head><title>Ansible Demo Lab</title></head>
      <body style="font-family: sans-serif; text-align: center; padding-top: 50px;">
        <h1 style="color: #2c3e50;">🚀 Welcome to Nginx Web Server!</h1>
        <p style="color: #27ae60; font-weight: bold;">Cai dat va cau hinh tu dong 100% bang Ansible Role</p>
      </body>
      </html>
    dest: /var/www/html/index.html
    owner: www-data
    group: www-data
    mode: '0644'


# 4. Dam bao service Nginx khoi chay
- name: Dam bao Nginx dang chay va khoi dong cung OS
  ansible.builtin.service:
    name: nginx
    state: started
    enabled: yes
- name: Ghi server_name vao /etc/hosts
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '^127\.0\.0\.1\s+\S+\s+# managed by ansible nginx role$'
    line: "127.0.0.1 {{ server_name }} # managed by ansible nginx role"
    owner: root
    group: root
    mode: '0644'


# 5. Vault: mat khau admin (giai ma tu vault.yml) -> file htpasswd tren server
#    Server chi luu HASH, no_log de mat khau khong lot ra output/log
- name: Tao file htpasswd cho trang /admin tu mat khau trong Ansible Vault
  ansible.builtin.copy:
    content: "{{ admin_user }}:{{ vault_admin_password | password_hash('sha512', 'ansibleseminar') }}\n"
    dest: /etc/nginx/.htpasswd
    owner: root
    group: www-data
    mode: '0640'
  no_log: true

- name: Tao thu muc /admin
  ansible.builtin.file:
    path: "{{ document_root }}/admin"
    state: directory
    owner: www-data
    group: www-data
    mode: '0755'

- name: Tao trang /admin (duoc bao ve bang Basic Auth)
  ansible.builtin.copy:
    content: |
      <html>
      <head><title>Admin Area</title></head>
      <body style="font-family: sans-serif; text-align: center; padding-top: 50px;">
        <h1 style="color: #c0392b;">🔐 Admin Area</h1>
        <p>Mat khau duoc lay tu Ansible Vault - khong nam dang plaintext trong Git.</p>
      </body>
      </html>
    dest: "{{ document_root }}/admin/index.html"
    owner: www-data
    group: www-data
    mode: '0644'

